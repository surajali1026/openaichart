
name: OpenAIChart Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'OpenAIChart-Android-Project.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q OpenAIChart-Android-Project.zip
          ls -la openaichart-work

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        working-directory: openaichart-work
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenAIChart-APK
          path: openaichart-work/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
